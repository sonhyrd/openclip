name: Release

# Publishes a fork release: a Release build, ad-hoc signed and zipped, plus an
# appcast.xml signed with THIS fork's Ed25519 key (secret SPARKLE_ED_PRIVATE_KEY,
# public half pinned as SUPublicEDKey in project.yml). The app's SUFeedURL points at
# this repo's latest release, so an installed fork build updates to fork builds and
# is never replaced by an upstream release that carries no Claude CLI provider.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.3.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PROJECT_VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/')
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match project.yml MARKETING_VERSION $PROJECT_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch Sparkle tools
        run: |
          URL=$(curl -sL https://api.github.com/repos/sparkle-project/Sparkle/releases/latest \
            | grep -o 'https://[^"]*\.tar\.xz' | head -1)
          mkdir -p scripts/bin /tmp/sparkle
          curl -sL "$URL" | tar xJ -C /tmp/sparkle
          cp /tmp/sparkle/bin/generate_appcast /tmp/sparkle/bin/sign_update scripts/bin/
          chmod +x scripts/bin/generate_appcast scripts/bin/sign_update

      - name: Build, sign and package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set; the appcast cannot be signed."
            exit 1
          fi
          ./scripts/release_update.sh "${{ steps.version.outputs.version }}"

      - name: Verify the appcast points at this fork and is signed
        run: |
          grep -q 'sparkle:edSignature=' build/release/appcast.xml
          grep -q 'sonhyrd/openclip' build/release/appcast.xml
          ! grep -q 'ganeshmshetty' build/release/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          NOTES="build/release/OpenClip-v$V.md"
          [ -s "$NOTES" ] || echo "OpenClip version $V." > "$NOTES"
          gh release create "v$V" \
            --title "v$V" \
            --notes-file "$NOTES" \
            "build/release/OpenClip-v$V.zip" \
            "build/release/OpenClip-v$V.dmg" \
            "build/release/appcast.xml" \
          || gh release upload "v$V" \
            "build/release/OpenClip-v$V.zip" \
            "build/release/OpenClip-v$V.dmg" \
            "build/release/appcast.xml" --clobber
