name: Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Tests
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install Tools (XcodeGen & xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Full Test Suite (0 skips)
        run: ./scripts/test.sh

      # Deliberately ad-hoc. Pull requests from forks get no access to secrets, so a signing
      # certificate here would only work for branches pushed by collaborators — and a check that
      # silently does nothing on fork PRs is worse than one that runs the same way for everyone.
      # An ad-hoc build still exercises the whole signing path: the real entitlements and the
      # inside-out pass over Sparkle's nested helpers. Only the hardened runtime is left off,
      # because under it an ad-hoc app cannot load its own frameworks.
      - name: Build App (Release, ad-hoc signed)
        run: ./scripts/package_app.sh

      # package_app.sh already gates this, but asserting it here too keeps the guarantee visible
      # in the workflow and independent of that script's internals. Verifying the app unpacked
      # from the archive rather than the build product also covers the archive itself. This is the
      # regression that shipped for months unnoticed: project.yml asked for the hardened runtime,
      # Xcode honoured it, and a `codesign --deep` at packaging time quietly stripped it back off.
      - name: Verify Hardening & Entitlements
        run: |
          rm -rf /tmp/ci-verify
          mkdir -p /tmp/ci-verify
          ditto -x -k build/OpenClip.zip /tmp/ci-verify
          ./scripts/verify_signing.sh /tmp/ci-verify/OpenClip.app --require any

      # Signature checks read the bundle; this runs the unpacked app. An ad-hoc build carrying the
      # hardened runtime passes every static check yet dyld refuses its own Core.framework
      # ("different Team IDs"), which is how the 1.6.2 sync produced unlaunchable fork builds.
      - name: Launch Guard (dyld loads every framework)
        run: ./scripts/verify_launch.sh /tmp/ci-verify/OpenClip.app

      # The zip package_app.sh produces was built and then discarded. Without this
      # the only way to get a runnable OpenClip.app is a local Xcode install, which
      # is exactly what CI exists to avoid needing.
      - name: Upload OpenClip.app
        uses: actions/upload-artifact@v4
        with:
          name: OpenClip-${{ github.sha }}
          path: build/OpenClip.zip
          if-no-files-found: error
