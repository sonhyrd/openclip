name: Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Tests
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install Tools (XcodeGen & xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Full Test Suite (0 skips)
        run: ./scripts/test.sh

      - name: Build App (Release)
        run: ./scripts/package_app.sh

      # The zip package_app.sh produces was built and then discarded. Without this
      # the only way to get a runnable OpenClip.app is a local Xcode install, which
      # is exactly what CI exists to avoid needing.
      - name: Upload OpenClip.app
        uses: actions/upload-artifact@v4
        with:
          name: OpenClip-${{ github.sha }}
          path: build/OpenClip.zip
          if-no-files-found: error
